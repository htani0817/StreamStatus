[package]
name = "stream-status"
version = "1.0.0"
description = "StreamStatus for Twitch"
edition = "2021"
license = "MIT"
repository = "https://github.com/htani0817/StreamStatus"
publish = false

[[bin]]
name = "StreamStatus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS は Windows 標準（SChannel）を使い、exe を小さく保つ
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
